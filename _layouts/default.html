<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="{{ site.theme-color }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  {% include theme-init.html %}
</head>
<body>

<header class="masthead">
  <div class="wrap" style="display:flex;align-items:baseline;justify-content:space-between;width:100%">
    <span class="brand"><a href="{{ '/' | relative_url }}" style="text-decoration:none">{{ site.title }}</a></span>
    <span class="mast-right">
      {% if page.layout == 'post' %}
      <span class="body-toggle" role="group" aria-label="正文浏览方式">
        <button class="vt-btn" data-body-view="waterfall" type="button">瀑布流</button>
        <button class="vt-btn" data-body-view="paged" type="button">翻页</button>
      </span>
      <button class="reading-toggle" id="readingToggle" type="button" aria-label="阅读模式" title="阅读模式" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5"/><path d="M8 7.5h8M8 11h6"/></svg>
      </button>
      {% endif %}
      <a class="mast-search" href="{{ '/search.html' | relative_url }}" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </a>
      {% include theme-toggle.html %}
    </span>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="footer">
  <div class="wrap">
    <span class="brand">{{ site.title }}</span>
  </div>
</footer>

{% include sidebar.html %}
</body>
</html>
