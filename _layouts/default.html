<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta name="theme-color" content="{{ site.theme-color }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>

<header class="masthead">
  <div class="wrap" style="display:flex;align-items:baseline;justify-content:space-between;width:100%">
    <span class="brand"><a href="{{ '/' | relative_url }}" style="text-decoration:none">{{ site.title }}</a></span>
    <span class="mast-loc">
      {{ page.title | default: site.title }}{% if page.note %} · {{ page.note }}{% endif %}
    </span>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="footer">
  <div class="wrap">
    <span class="brand">{{ site.title }}</span>
  </div>
</footer>

{% include sidebar.html %}
</body>
</html>
